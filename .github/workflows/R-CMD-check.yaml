name: R CMD check with renv

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    # Authenticate GitHub API calls (e.g. renv resolving the DESCRIPTION
    # Remotes field); unauthenticated runners share exhausted rate limits.
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu-latest
          - os: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'        # exact match to renv.lock; a floating '4.3' lets
                                    # patch releases drift CI's numerical/deprecation
                                    # behavior away from the tested environment
          use-public-rspm: true

      # Pandoc is needed to (re)build vignettes/rmarkdown docs during --as-cran.
      - name: Set up pandoc
        uses: r-lib/actions/setup-pandoc@v2

      # Source-built dependencies need system libraries not preinstalled on the
      # Ubuntu runner (renv restore builds from source on Linux):
      #   - Rsymphony (via PortfolioAnalytics -> ROI.plugin.symphony): SYMPHONY
      #   - igraph (via igraph/ggraph): GLPK (libglpk.so.40)
      #   - systemfonts/textshaping/png: fontconfig / harfbuzz / png headers
      # Windows installs prebuilt binaries that bundle these, so this is Linux-only.
      - name: Install system libraries for source builds (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            coinor-libsymphony-dev \
            libglpk-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libpng-dev

      # renv reads RENV_CONFIG_REPOS_OVERRIDE ahead of the lockfile's own
      # Repositories entry (renv/activate.R), and `use-public-rspm: true` points
      # it at PPM's floating `latest` snapshot. That is what broke the "pinned"
      # lockfile: PPM moved to a newer TBB ABI and the pinned rstan 2.32.7
      # binary stopped loading. Pin both variables to the dated snapshot that
      # matches renv.lock so restores are actually reproducible.
      # The Linux codename is read from the runner rather than hard-coded, so a
      # future ubuntu-latest bump degrades to source builds instead of pulling
      # binaries built for the wrong distro.
      - name: Pin package repositories to a dated PPM snapshot
        shell: bash
        run: |
          snapshot="2026-07-20"
          if [ "$RUNNER_OS" = "Linux" ]; then
            codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
            url="https://packagemanager.posit.co/cran/__linux__/${codename}/${snapshot}"
          else
            url="https://packagemanager.posit.co/cran/${snapshot}"
          fi
          echo "RSPM=${url}" >> "$GITHUB_ENV"
          echo "RENV_CONFIG_REPOS_OVERRIDE=${url}" >> "$GITHUB_ENV"
          echo "Pinned package repository: ${url}"

      - name: Set up renv and restore (installs the lockfile's renv 1.1.4)
        uses: r-lib/actions/setup-renv@v2

      # rcmdcheck is the check *driver*, not a package dependency, so it is
      # deliberately absent from renv.lock. Install it into the ephemeral CI
      # library only; do NOT snapshot it back into the lock.
      - name: Install check driver (rcmdcheck)
        run: renv::install("rcmdcheck")
        shell: Rscript {0}

      - name: Run R CMD check
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--as-cran"),
            error_on = "error"
          )
        shell: Rscript {0}
