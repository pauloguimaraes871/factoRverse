# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Builds the pkgdown site and deploys it to the gh-pages branch.
name: pkgdown

on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'        # exact match to renv.lock and the check
                                    # workflows; an unpinned version resolves the
                                    # documented API against a different R than
                                    # the one the package is tested on
          use-public-rspm: true

      # This job does not use renv, so RENV_CONFIG_REPOS_OVERRIDE (which pins the
      # check workflows) has no effect here: pak resolves against the `repos`
      # option that `use-public-rspm: true` writes into Rprofile.site. Pin that
      # to the same dated snapshot as renv.lock, otherwise the site build drifts
      # onto a newer RcppParallel/oneTBB than the rstan binary was built against
      # and loading the package namespace fails. Appending wins because
      # Rprofile.site is sourced top to bottom.
      - name: Pin package repositories to a dated PPM snapshot
        shell: bash
        run: |
          snapshot="2026-07-20"
          codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          url="https://packagemanager.posit.co/cran/__linux__/${codename}/${snapshot}"
          profile="$(Rscript -e 'cat(file.path(R.home("etc"), "Rprofile.site"))')"
          echo "options(repos = c(CRAN = \"${url}\"))" | sudo tee -a "${profile}" > /dev/null
          echo "RSPM=${url}" >> "$GITHUB_ENV"
          echo "Pinned package repository: ${url}"
          Rscript -e 'stopifnot(grepl("2026-07-20", getOption("repos")[["CRAN"]])); cat("repos in effect:", getOption("repos")[["CRAN"]], "\n")'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # ParBayesianOptimization is archived on CRAN, so pak cannot resolve it
          # from the public repos; pull it from its live GitHub source instead.
          # (Proper fix in Phase 5: move it to Suggests behind a requireNamespace guard.)
          extra-packages: |
            any::pkgdown
            github::AnotherSamWilson/ParBayesianOptimization
            local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # TEMPORARY (revert before merging): pkgdown does not run on pull requests,
      # so the only way to verify the repository pin on this branch is a manual
      # dispatch. Without this guard that dispatch would publish branch-built
      # docs to the live gh-pages site. Build, do not deploy.
      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
